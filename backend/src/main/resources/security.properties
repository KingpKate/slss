# In Tomcat, override this file with:
# ${catalina.base}/conf/slss/security.properties
# Must be replaced with a random value of at least 32 bytes before production use.
security.jwtSecret=change-this-secret-to-a-32-byte-production-secret
security.jwtTtl=PT8H
security.refreshSecret=replace-this-independent-refresh-secret-32-bytes
security.refreshTtl=P30D
security.corsAllowedOrigins=http://localhost:5173
